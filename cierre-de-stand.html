<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Cierre de Stand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F6F8;
    --surface:#FFFFFF;
    --surface-2:#EEF3F6;
    --ink:#101826;
    --ink-muted:#4A6670;
    --ink-faint:#69868D;
    --line:#DCE6EA;
    --line-strong:#C3D2D8;
    --accent:#0C9DE5;
    --accent-ink:#FFFFFF;
    --accent-soft:#E1F3FC;
    --accent-2:#009BEB;
    --accent-2-soft:#DCF1FC;
    --accent-3:#180B5D;
    --accent-3-soft:#E7E5F5;
    --good:#1E9E64;
    --good-soft:#DCF1E5;
    --warn:#C97F00;
    --warn-soft:#F7E7C6;
    --bad:#C6293D;
    --bad-soft:#F8DEE1;
    --chart-1:#0C9DE5;
    --chart-2:#B87800;
    --chart-3:#0B9C86;
    --chart-4:#4A3FA8;
    --chart-5:#2F9E52;
    --chart-6:#B23A8C;
    --chart-other:#759192;
    --shadow-1: 0 1px 2px rgba(16,24,38,0.06), 0 1px 1px rgba(16,24,38,0.04);
    --shadow-2: 0 8px 24px rgba(16,24,38,0.10), 0 2px 6px rgba(16,24,38,0.06);
    --radius-s: 8px;
    --radius-m: 12px;
    --radius-l: 18px;
    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0A1420;
      --surface:#0E1B2B;
      --surface-2:#152840;
      --ink:#EAF2F6;
      --ink-muted:#86ACB9;
      --ink-faint:#60808B;
      --line:#213244;
      --line-strong:#2C4258;
      --accent:#35B6F2;
      --accent-ink:#180B5D;
      --accent-soft:#0F3247;
      --accent-2:#51ADEF;
      --accent-2-soft:#0F3550;
      --accent-3:#6363C6;
      --accent-3-soft:#221F3D;
      --good:#3FC584;
      --good-soft:#123726;
      --warn:#D9A22C;
      --warn-soft:#332B12;
      --bad:#E5566A;
      --bad-soft:#3A1820;
      --chart-1:#008FDB;
      --chart-2:#BC7400;
      --chart-3:#009880;
      --chart-4:#746EE1;
      --chart-5:#2F9E52;
      --chart-6:#C14F9B;
      --chart-other:#759192;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.3), 0 1px 1px rgba(0,0,0,0.2);
      --shadow-2: 0 8px 24px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A1420;
    --surface:#0E1B2B;
    --surface-2:#152840;
    --ink:#EAF2F6;
    --ink-muted:#86ACB9;
    --ink-faint:#60808B;
    --line:#213244;
    --line-strong:#2C4258;
    --accent:#35B6F2;
    --accent-ink:#180B5D;
    --accent-soft:#0F3247;
    --accent-2:#51ADEF;
    --accent-2-soft:#0F3550;
    --accent-3:#6363C6;
    --accent-3-soft:#221F3D;
    --good:#3FC584;
    --good-soft:#123726;
    --warn:#D9A22C;
    --warn-soft:#332B12;
    --bad:#E5566A;
    --bad-soft:#3A1820;
    --chart-1:#008FDB;
    --chart-2:#BC7400;
    --chart-3:#009880;
    --chart-4:#746EE1;
    --chart-5:#2F9E52;
    --chart-6:#C14F9B;
    --chart-other:#759192;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.3), 0 1px 1px rgba(0,0,0,0.2);
    --shadow-2: 0 8px 24px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.3);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-soft); }
  h1,h2,h3,h4{ font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0; color:var(--ink); }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  ::-webkit-scrollbar{ height:10px; width:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:6px; }

  #shell{ display:flex; min-height:100vh; }

  /* ---------- sidebar ---------- */
  #sidebar{
    width:236px; flex:none;
    background:var(--surface);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    padding:20px 14px;
    gap:18px;
  }
  .brand{ display:flex; align-items:center; padding:2px 4px 0; }
  .brand-logo{ width:100%; max-width:188px; height:auto; display:block; }
  .brand-bar{ height:3px; border-radius:3px; margin:9px 4px 10px; background:linear-gradient(90deg, var(--accent) 0%, var(--accent-3) 100%); }
  .brand-title{ padding:0 4px 8px; }
  .brand-title h1{ font-size:15px; line-height:1.15; }
  .brand-title span{ display:block; font-size:11px; color:var(--ink-muted); margin-top:2px; }

  .event-picker{ display:flex; flex-direction:column; gap:6px; }
  .event-picker label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); font-weight:600; padding:0 2px; }
  select#eventSelect{
    width:100%; padding:9px 10px; border-radius:var(--radius-s);
    border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink);
    font-family:inherit; font-size:13px; font-weight:600;
    appearance:none; cursor:pointer;
  }
  .btn-new-event{
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:8px 10px; border-radius:var(--radius-s); border:1px dashed var(--line-strong);
    background:transparent; color:var(--ink-muted); font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .btn-new-event:hover{ border-color:var(--accent); color:var(--accent); }

  nav#tabs{ display:flex; flex-direction:column; gap:2px; margin-top:4px; }
  .tab-btn{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border-radius:var(--radius-s); border:none; background:transparent;
    color:var(--ink-muted); font-size:13.5px; font-weight:600; text-align:left; cursor:pointer;
  }
  .tab-btn svg{ width:16px; height:16px; flex:none; opacity:0.85; }
  .tab-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .tab-btn.active{ background:var(--accent-soft); color:var(--accent); }
  .tab-btn.active svg{ opacity:1; }

  .sidebar-foot{ margin-top:auto; padding:10px 6px 0; border-top:1px solid var(--line); }
  .sidebar-foot p{ font-size:11px; color:var(--ink-faint); line-height:1.5; }
  .db-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; position:relative; top:-1px; }

  /* ---------- main ---------- */
  #main{ flex:1; min-width:0; padding:26px 34px 60px; max-width:1180px; }
  .topbar{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
  .topbar .titles h2{ font-size:23px; }
  .topbar .titles .sub{ margin-top:4px; font-size:13px; color:var(--ink-muted); display:flex; gap:14px; flex-wrap:wrap; }
  .topbar .titles .sub span{ display:inline-flex; align-items:center; gap:5px; }
  .topbar .titles .sub svg{ width:13px; height:13px; opacity:0.7; }

  .badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:600; }
  .badge.good{ background:var(--good-soft); color:var(--good); }
  .badge.warn{ background:var(--warn-soft); color:var(--warn); }
  .badge.bad{ background:var(--bad-soft); color:var(--bad); }
  .badge.neutral{ background:var(--surface-2); color:var(--ink-muted); }
  .badge.accent{ background:var(--accent-soft); color:var(--accent); }

  section.view{ display:flex; flex-direction:column; gap:22px; }
  section.view[hidden]{ display:none; }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l); padding:22px; box-shadow:var(--shadow-1); }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .panel-head h3{ font-size:16px; }
  .panel-head p.hint{ font-size:12.5px; color:var(--ink-muted); margin-top:2px; }

  .btn{ display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:99px; font-size:13px; font-weight:600; border:1px solid transparent; cursor:pointer; white-space:nowrap; }
  .btn svg{ width:14px; height:14px; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-primary:disabled{ opacity:0.45; cursor:not-allowed; filter:none; }
  .btn-ghost{ background:transparent; border-color:var(--line-strong); color:var(--ink); }
  .btn-ghost:hover{ border-color:var(--ink-muted); }
  .btn-sm{ padding:6px 11px; font-size:12px; }

  /* KPI row */
  .kpi-row{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius-l); overflow:hidden; }
  .kpi{ background:var(--surface); padding:16px 18px; display:flex; flex-direction:column; gap:6px; }
  .kpi .kpi-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); font-weight:600; }
  .kpi .kpi-value{ font-family:var(--font-mono); font-size:26px; font-weight:600; line-height:1; }
  .kpi .kpi-delta{ font-size:11.5px; color:var(--ink-muted); }
  .kpi .kpi-delta.good{ color:var(--good); }
  .kpi .kpi-delta.bad{ color:var(--bad); }

  /* charts grid */
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:860px){ .grid-2{ grid-template-columns:1fr; } }

  .barchart{ display:flex; flex-direction:column; gap:12px; }
  .barchart .row{ display:flex; flex-direction:column; gap:5px; }
  .barchart .row-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .barchart .row .name{ font-size:12.5px; color:var(--ink); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .barchart .track{ height:14px; border-radius:5px; background:var(--surface-2); position:relative; overflow:hidden; }
  .barchart .fill{ position:absolute; inset:0 auto 0 0; border-radius:5px; }
  .barchart .value{ font-family:var(--font-mono); font-size:12px; text-align:right; color:var(--ink-muted); flex:none; }
  .legend{ display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
  .legend .item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-muted); }
  .legend .swatch{ width:9px; height:9px; border-radius:2.5px; flex:none; }

  .rank-list{ display:flex; flex-direction:column; gap:9px; }
  .rank-list .row{ display:grid; grid-template-columns:1fr 92px 34px; align-items:center; gap:10px; }
  .rank-list .name{ font-size:12.5px; color:var(--ink); }
  .rank-list .track{ height:8px; border-radius:4px; background:var(--surface-2); overflow:hidden; }
  .rank-list .fill{ height:100%; background:var(--accent-2); border-radius:4px; }
  .rank-list .count{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-muted); text-align:right; }

  /* Drill-down affordance: bars/legend items/rank rows that open the
     filtered contact list for that category. */
  .barchart .row.clickable, .rank-list .row.clickable{ margin:-6px -8px; padding:6px 8px; border-radius:var(--radius-s); cursor:pointer; transition:background .1s; }
  .barchart .row.clickable:hover, .rank-list .row.clickable:hover{ background:var(--surface-2); }
  .legend .item.clickable{ cursor:pointer; padding:2px 6px; margin:-2px -6px; border-radius:99px; transition:background .1s, color .1s; }
  .legend .item.clickable:hover{ background:var(--surface-2); color:var(--ink); }
  .barchart .row.clickable:focus-visible, .rank-list .row.clickable:focus-visible, .legend .item.clickable:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .prop-bar{ display:flex; flex-direction:column; gap:6px; }
  .prop-bar .track{ height:10px; border-radius:5px; background:var(--surface-2); overflow:hidden; }
  .prop-bar .fill{ height:100%; border-radius:5px; }
  .prop-bar .labels{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-muted); }

  .verdict-card{ display:flex; gap:16px; align-items:flex-start; padding:18px; border-radius:var(--radius-m); }
  .verdict-card .icon{ width:40px; height:40px; border-radius:11px; flex:none; display:flex; align-items:center; justify-content:center; }
  .verdict-card .icon svg{ width:20px; height:20px; }
  .verdict-card h4{ font-size:15.5px; margin-bottom:4px; }
  .verdict-card p{ font-size:13px; color:var(--ink-muted); line-height:1.55; }
  .verdict-card.good{ background:var(--good-soft); } .verdict-card.good .icon{ background:var(--good); color:#fff; }
  .verdict-card.warn{ background:var(--warn-soft); } .verdict-card.warn .icon{ background:var(--warn); color:#fff; }
  .verdict-card.bad{ background:var(--bad-soft); } .verdict-card.bad .icon{ background:var(--bad); color:#fff; }
  .verdict-card.neutral{ background:var(--surface-2); } .verdict-card.neutral .icon{ background:var(--ink-faint); color:#fff; }

  /* send banner */
  .send-banner{ display:flex; gap:16px; align-items:center; padding:18px 20px; border-radius:var(--radius-m);
    background:linear-gradient(90deg, var(--accent-3) 0%, var(--accent) 130%); color:#fff; flex-wrap:wrap; }
  .send-banner .icon{ width:40px; height:40px; border-radius:11px; flex:none; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.18); }
  .send-banner .icon svg{ width:20px; height:20px; stroke:#fff; }
  .send-banner .text{ flex:1; min-width:220px; }
  .send-banner h4{ font-size:15.5px; margin-bottom:3px; color:#fff; }
  .send-banner p{ font-size:12.5px; color:rgba(255,255,255,.86); line-height:1.5; }
  .send-banner .btn{ flex:none; }
  .send-banner .btn-primary{ background:#fff; color:var(--accent-3); border-color:#fff; }
  .send-banner .btn-primary:hover{ background:rgba(255,255,255,.9); }
  .send-note{ display:flex; gap:10px; align-items:center; padding:11px 14px; border-radius:var(--radius-s); background:var(--good-soft); color:var(--good); font-size:12.5px; font-weight:600; }
  .send-note svg{ width:16px; height:16px; flex:none; }

  .recipient-list{ display:flex; flex-wrap:wrap; gap:8px; }
  .recipient-item{ display:flex; align-items:center; gap:7px; padding:7px 12px 7px 9px; border:1px solid var(--line); border-radius:99px; cursor:pointer; font-size:12.5px; user-select:none; }
  .recipient-item:hover{ border-color:var(--line-strong); background:var(--surface-2); }
  .recipient-item input[type="checkbox"]{ width:14px; height:14px; accent-color:var(--accent); flex:none; }

  /* tables */
  .table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-m); }
  table{ border-collapse:collapse; width:100%; min-width:640px; }
  thead th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); font-weight:600; padding:10px 12px; background:var(--surface-2); position:sticky; top:0; white-space:nowrap; }
  tbody td{ padding:10px 12px; font-size:13px; border-top:1px solid var(--line); white-space:nowrap; }
  tbody tr:hover td{ background:var(--surface-2); }
  td.wrap{ white-space:normal; max-width:220px; }
  td.num{ font-family:var(--font-mono); text-align:right; }

  /* upload */
  .dropzone{
    border:2px dashed var(--line-strong); border-radius:var(--radius-m); padding:30px 20px;
    display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; cursor:pointer;
    background:var(--surface-2); transition:border-color .15s, background .15s;
  }
  .dropzone:hover, .dropzone.drag{ border-color:var(--accent); background:var(--accent-soft); }
  .dropzone svg{ width:30px; height:30px; color:var(--ink-faint); }
  .dropzone strong{ font-size:13.5px; }
  .dropzone span{ font-size:12px; color:var(--ink-muted); }

  .field-map{ display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
  .field-chip{ display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:99px; font-size:11.5px; background:var(--surface-2); color:var(--ink-muted); }
  .field-chip.ok{ background:var(--good-soft); color:var(--good); }
  .field-chip.missing{ background:var(--warn-soft); color:var(--warn); }

  /* survey */
  .exec-list{ display:flex; flex-direction:column; gap:10px; }
  .exec-card{ border:1px solid var(--line); border-radius:var(--radius-m); padding:14px 16px; }
  .exec-card .exec-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .exec-card .exec-name{ font-weight:600; font-size:14px; }
  .exec-card .exec-meta{ font-size:12px; color:var(--ink-muted); margin-top:2px; }
  .exec-card .exec-done{ font-size:12px; color:var(--ink-muted); margin-top:8px; display:flex; gap:14px; flex-wrap:wrap; }
  .exec-form{ margin-top:14px; padding-top:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:14px; }
  .q-label{ font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:8px; display:block; }
  .seg{ display:flex; gap:6px; flex-wrap:wrap; }
  .seg button{ padding:7px 13px; border-radius:99px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-muted); font-size:12.5px; font-weight:600; cursor:pointer; }
  .seg button:hover{ border-color:var(--accent); }
  .seg button.sel{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  textarea.comment{ width:100%; min-height:60px; resize:vertical; padding:9px 11px; border-radius:var(--radius-s); border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-family:inherit; font-size:13px; }

  .roster-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:8px; }
  .roster-item{ display:flex; align-items:center; gap:9px; padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius-s); cursor:pointer; }
  .roster-item:hover{ border-color:var(--line-strong); background:var(--surface-2); }
  .roster-item input[type="checkbox"]{ width:16px; height:16px; accent-color:var(--accent); flex:none; }
  .roster-item .info{ display:flex; flex-direction:column; gap:1px; overflow:hidden; min-width:0; }
  .roster-item strong{ font-size:12.5px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .roster-item small{ font-size:11px; color:var(--ink-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .add-roster-form{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .add-roster-form input{ flex:1; min-width:160px; padding:9px 11px; border-radius:var(--radius-s); border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-family:inherit; font-size:13px; }

  .empty-state{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding:50px 20px; color:var(--ink-muted); }
  .empty-state svg{ width:36px; height:36px; color:var(--ink-faint); }
  .empty-state h3{ font-size:15.5px; color:var(--ink); }
  .empty-state p{ font-size:13px; max-width:360px; }

  /* modal */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(15,20,18,0.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal{ background:var(--surface); border-radius:var(--radius-l); padding:24px; width:100%; max-width:420px; box-shadow:var(--shadow-2); display:flex; flex-direction:column; gap:14px; }
  .modal h3{ font-size:17px; }
  .modal label{ font-size:12px; font-weight:600; color:var(--ink-muted); display:block; margin-bottom:5px; }
  .modal input, .modal textarea{ width:100%; padding:9px 11px; border-radius:var(--radius-s); border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink); font-family:inherit; font-size:13.5px; }
  .modal textarea{ min-height:56px; resize:vertical; }
  .modal .field{ display:flex; flex-direction:column; }
  .modal .actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:4px; }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:99px; font-size:13px; font-weight:600; box-shadow:var(--shadow-2); z-index:80; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  @media (max-width:760px){
    #shell{ flex-direction:column; }
    #sidebar{ width:100%; flex-direction:row; flex-wrap:wrap; align-items:center; }
    nav#tabs{ flex-direction:row; flex-wrap:wrap; }
    .sidebar-foot{ display:none; }
    #main{ padding:20px; }
  }

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------------- */
  /* utils                                                              */
  /* ---------------------------------------------------------------- */
  function genId(prefix){ return (prefix||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function slugify(s){
    var v = (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'');
    return v || 'sin-nombre';
  }
  function normalizeHeader(h){
    return (h||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  }
  function escapeHtml(s){
    return (s===null||s===undefined? '': String(s)).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmtInt(n){ return (n===null||n===undefined||isNaN(n)) ? '—' : Math.round(n).toLocaleString('es-PE'); }
  function fmtUsd(n){ return (n===null||n===undefined||isNaN(n)) ? '—' : 'USD$ '+Math.round(n).toLocaleString('es-PE'); }
  function fmtDateTime(iso){
    if(!iso) return '—';
    var d = new Date(iso);
    if(isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('es-PE', {day:'numeric', month:'short', year:'numeric'}) + ', ' +
      d.toLocaleTimeString('es-PE', {hour:'2-digit', minute:'2-digit'});
  }
  function fmtDate(iso){
    if(!iso) return '';
    var parts = iso.split('-');
    if(parts.length!==3) return iso;
    var d = new Date(Date.UTC(+parts[0], +parts[1]-1, +parts[2]));
    return d.toLocaleDateString('es-PE', { day:'2-digit', month:'short', year:'numeric', timeZone:'UTC' });
  }
  function fmtDateRange(start, end){
    if(!start) return '';
    if(!end || end===start) return fmtDate(start);
    var sParts = start.split('-'), eParts = end.split('-');
    if(sParts.length!==3 || eParts.length!==3) return fmtDate(start);
    var sd = new Date(Date.UTC(+sParts[0], +sParts[1]-1, +sParts[2]));
    var ed = new Date(Date.UTC(+eParts[0], +eParts[1]-1, +eParts[2]));
    var sameYear = sParts[0]===eParts[0];
    var sameMonth = sameYear && sParts[1]===eParts[1];
    var fullFmt = { day:'2-digit', month:'short', year:'numeric', timeZone:'UTC' };
    if(sameMonth){
      return sd.toLocaleDateString('es-PE', { day:'2-digit', timeZone:'UTC' }) + '–' + ed.toLocaleDateString('es-PE', fullFmt);
    }
    if(sameYear){
      return sd.toLocaleDateString('es-PE', { day:'2-digit', month:'short', timeZone:'UTC' }) + ' – ' + ed.toLocaleDateString('es-PE', fullFmt);
    }
    return sd.toLocaleDateString('es-PE', fullFmt) + ' – ' + ed.toLocaleDateString('es-PE', fullFmt);
  }

  function parsePrice(raw){
    if(raw===undefined || raw===null) return null;
    if(typeof raw === 'number') return isFinite(raw)? raw: null;
    var s = raw.toString().trim();
    if(!s) return null;
    var range = s.match(/([\d.,]+)\s*(?:-|a|to)\s*([\d.,]+)/i);
    if(range){
      var a = parsePrice(range[1]), b = parsePrice(range[2]);
      if(a!==null && b!==null) return (a+b)/2;
    }
    s = s.replace(/[^0-9.,]/g,'');
    if(!s) return null;
    var hasDot = s.indexOf('.') > -1, hasComma = s.indexOf(',') > -1;
    if(hasDot && hasComma){
      if(s.lastIndexOf(',') > s.lastIndexOf('.')){ s = s.replace(/\./g,'').replace(',', '.'); }
      else { s = s.replace(/,/g,''); }
    } else if(hasComma && !hasDot){
      var parts = s.split(',');
      if(parts.length===2 && parts[1].length===3){ s = parts.join(''); }
      else { s = s.replace(',', '.'); }
    } else if(hasDot && !hasComma){
      var dparts = s.split('.');
      if(dparts.length===2 && dparts[1].length===3){ s = dparts.join(''); }
    }
    var n = parseFloat(s);
    return isNaN(n) ? null : n;
  }

  function parseWorkbookFile(file){
    return new Promise(function(resolve, reject){
      var isCsv = /\.csv$/i.test(file.name);
      var reader = new FileReader();
      reader.onerror = function(){ reject(reader.error); };
      reader.onload = function(e){
        try{
          var wb = isCsv ? XLSX.read(e.target.result, {type:'string'}) : XLSX.read(new Uint8Array(e.target.result), {type:'array'});
          var sheetName = wb.SheetNames[0];
          var rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {defval:''});
          resolve(rows);
        }catch(err){ reject(err); }
      };
      if(isCsv) reader.readAsText(file); else reader.readAsArrayBuffer(file);
    });
  }

  function computeEventSummary(contacts, surveys, assignedExecs){
    contacts = contacts || []; surveys = surveys || []; assignedExecs = assignedExecs || [];
    var execSet = {};
    contacts.forEach(function(c){ var n=(c.ejecutivo||'').trim(); if(n) execSet[slugify(n)]=true; });
    assignedExecs.forEach(function(slug){ if(slug) execSet[slug]=true; });
    var scored = surveys.filter(function(s){ return typeof s.apreciacion === 'number'; });
    var avgApreciacion = scored.length ? (scored.reduce(function(a,s){ return a+s.apreciacion; },0)/scored.length) : null;
    function yn(v){ return v==='si'?1: v==='tal_vez'?0.5: v==='no'?0: null; }
    var volverVals = surveys.map(function(s){ return yn(s.volveria); }).filter(function(v){ return v!==null; });
    var standVals = surveys.map(function(s){ return yn(s.standInvertir); }).filter(function(v){ return v!==null; });
    var pctVolver = volverVals.length ? Math.round(100*volverVals.reduce(function(a,b){return a+b;},0)/volverVals.length) : null;
    var pctStand = standVals.length ? Math.round(100*standVals.reduce(function(a,b){return a+b;},0)/standVals.length) : null;
    var totalPrice = contacts.reduce(function(a,c){ return a + (typeof c.precioAproxNum==='number' ? c.precioAproxNum : 0); }, 0);
    var teamCount = Object.keys(execSet).length;
    var progressPct = Math.round(100 * ([contacts.length>0, teamCount>0, teamCount>0 && surveys.length>=teamCount].filter(Boolean).length) / 3);
    return { contactCount: contacts.length, execCount: teamCount, surveyCount: surveys.length,
      avgApreciacion: avgApreciacion, pctVolver: pctVolver, pctStand: pctStand, totalPrice: totalPrice, progressPct: progressPct };
  }

  function maybeUpdateEventSummary(eventId){

    var summary = computeEventSummary(state.contactsByEvent[eventId], state.surveysByEvent[eventId], ev.assignedExecs);
    var changed = JSON.stringify(ev.summary||{}) !== JSON.stringify(summary);
    if(changed){
      ev.summary = summary;
      saveLocal();
    }
  }

  var LOCAL_KEY = 'cierreDeStand:v1';

  function loadLocal(){

      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){ localStorageOk = false; return null; }
  }

  function saveLocal(){
    if(!localStorageOk) return;
    try{
      var data = {
        events: state.events,
        contactsByEvent: state.contactsByEvent,
        surveysByEvent: state.surveysByEvent,
        execRoster: state.execRoster
      };
      localStorage.setItem(LOCAL_KEY, JSON.stringify(data));
      if(!localStorageOk){ localStorageOk = true; updateDbStatus(); }
    }catch(e){
      if(localStorageOk){
        localStorageOk = false;
        updateDbStatus();
        toast('No se pudo guardar en este navegador (almacenamiento lleno o bloqueado).', 4000);
      }
    }
  }

  function updateDbStatus(){
    var dot = document.getElementById('dbDot'), txt = document.getElementById('dbStatus');
    if(!dot || !txt) return;
    if(localStorageOk){ dot.style.background = 'var(--good)'; txt.textContent = 'Guardado en este navegador'; }

  function applyHashRoute(){
    if(state.hashApplied) return;
    var hash = (location.hash||'').replace(/^#/,'');
    if(!hash) return;
    var parts = hash.split('/');
    var eventId = parts[0];
    var tab = parts[1];
    if(!state.events.some(function(e){ return e.id===eventId; })) return;
    state.hashApplied = true;
    state.currentEventId = eventId;
    if(tab && ['resumen','contactos','encuesta','reporte'].indexOf(tab)>=0){
      state.activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===tab); });
      document.querySelectorAll('section.view').forEach(function(v){ v.hidden = v.id !== 'view-'+tab; });
    }
  }

  function initDb(){
    state.db = null;

    var seededRoster = ROSTER_SEED.map(function(p){ return { slug: slugify(p.name), name:p.name, email:p.email }; })
      .sort(function(a,b){ return a.name.localeCompare(b.name); });
    if(loaded){
      state.events = loaded.events || [];
      state.contactsByEvent = loaded.contactsByEvent || {};
      state.surveysByEvent = loaded.surveysByEvent || {};
      state.execRoster = (loaded.execRoster && loaded.execRoster.length) ? loaded.execRoster : seededRoster;
    } else {
      state.execRoster = seededRoster;
    }
    updateDbStatus();
    applyHashRoute();
    if(!state.currentEventId || !state.events.some(function(e){ return e.id===state.currentEventId; })){
      state.currentEventId = state.events.length ? state.events[0].id : null;
    }

  function createEvent(payload){
    var id = genId('evt');
    var doc = Object.assign({ assignedExecs: [], createdAt: new Date().toISOString() }, payload);
    state.parsedUpload = null;
    state.openExecSlug = null;
    state.surveyDraft = {};
    state.showAddRoster = false;
    state.events.unshift(Object.assign({id:id}, doc));
    state.currentEventId = id;
    state.contactsByEvent[id] = []; state.surveysByEvent[id] = [];
    saveLocal();
    renderAll();
  }

  function updateEvent(id, patch){
    var ev = state.events.find(function(e){ return e.id===id; });
    if(ev){ Object.assign(ev, patch); saveLocal(); renderAll(); }
  }

  function afterEventDeleted(eventId){
    if(state.currentEventId===eventId){
      state.currentEventId = state.events.length ? state.events[0].id : null;
      state.parsedUpload = null;
      state.openExecSlug = null;
      state.surveyDraft = {};
      state.showAddRoster = false;
      subscribeEventChildren();
    }
    delete state.contactsByEvent[eventId];
    delete state.surveysByEvent[eventId];
    saveLocal();
    toast('Feria eliminada.');

    stamped.forEach(function(r){ arr.push(Object.assign({id: genId('c')}, r)); });

  function submitSurvey(eventId, execName, answers){
    var slug = slugify(execName);
    var payload = { ejecutivo: execName, apreciacion: answers.apreciacion, volveria: answers.volveria,
      standInvertir: answers.standInvertir, comentario: answers.comentario||'', submittedAt: new Date().toISOString() };
    var arr = state.surveysByEvent[eventId] || (state.surveysByEvent[eventId]=[]);
    var idx = arr.findIndex(function(s){ return s.id===slug; });
    var rec = Object.assign({id:slug}, payload);
    if(idx>=0) arr[idx]=rec; else arr.push(rec);

  function setExecAssigned(eventId, slug, assigned){
    var ev = state.events.find(function(e){ return e.id===eventId; });
    if(!ev) return;
    var list = (ev.assignedExecs||[]).slice();
    var idx = list.indexOf(slug);
    if(assigned && idx<0) list.push(slug);
    if(!assigned && idx>=0) list.splice(idx,1);
    updateEvent(eventId, { assignedExecs: list });

  function addRosterMember(eventId, name, email){
    name = (name||'').trim(); email = (email||'').trim();
    if(!name){ toast('Escribe el nombre del comercial.'); return; }
    var slug = slugify(name);
    var already = state.execRoster.some(function(p){ return p.slug===slug; });
    if(!already){
      var doc = { name:name, email:email, createdAt:new Date().toISOString() };
      state.execRoster.push(Object.assign({slug:slug}, doc));
      state.execRoster.sort(function(a,b){ return a.name.localeCompare(b.name); });
      saveLocal();

    setExecAssigned(eventId, slug, true);

  function getExecList(eventId){
    var ev = state.events.find(function(e){ return e.id===eventId; });
    var contacts = state.contactsByEvent[eventId] || [];
    var rosterBySlug = {};
    state.execRoster.forEach(function(p){ rosterBySlug[p.slug] = p; });
    var map = {}; var order = [];
    contacts.forEach(function(c){
      var name = (c.ejecutivo||'').trim(); if(!name) return;
      var slug = slugify(name);
      if(!map[slug]){ map[slug] = {slug:slug, name:name, count:0, email:null}; order.push(slug); }
      map[slug].count++;
    });
    (ev && ev.assignedExecs || []).forEach(function(slug){
      var p = rosterBySlug[slug];
      var name = p ? p.name : slug;
      if(!map[slug]){ map[slug] = {slug:slug, name:name, count:0, email:p?p.email:null}; order.push(slug); }
    });
    order.forEach(function(s){ if(!map[s].email && rosterBySlug[s]) map[s].email = rosterBySlug[s].email; });
    return order.map(function(s){ return map[s]; }).sort(function(a,b){ return b.count-a.count || a.name.localeCompare(b.name); });

  var CAT_COLORS = ['var(--chart-1)','var(--chart-2)','var(--chart-3)','var(--chart-4)','var(--chart-5)','var(--chart-6)'];

  function drillAttr(field, value){
    if(!field) return '';
    var call = "App.showContactsFor('"+field+"','"+encodeURIComponent(value)+"')";
    return ' role="button" tabindex="0" onclick="'+call+'" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();'+call+'}"';

  function categoricalBarsHtml(dataMap, field){
    var entries = Object.keys(dataMap).map(function(k){ return [k, dataMap[k]]; }).filter(function(e){ return e[1]>0; })
      .sort(function(a,b){ return b[1]-a[1]; });
    if(!entries.length) return '<p style="font-size:12.5px;color:var(--ink-muted);">Sin datos todavía.</p>';
    var top = entries.slice(0,6);
    var restSum = entries.slice(6).reduce(function(a,e){ return a+e[1]; }, 0);
    if(restSum>0) top.push(['Otros', restSum]);
    var max = Math.max.apply(null, top.map(function(e){ return e[1]; }).concat([1]));
    var rows = top.map(function(e,i){
      var color = e[0]==='Otros' ? 'var(--chart-other)' : CAT_COLORS[i % CAT_COLORS.length];
      var pct = Math.round(100*e[1]/max);
      var isClickable = field && e[0]!=='Otros';
      var clickAttr = isClickable ? drillAttr(field, e[0]) : '';
      return '<div class="row'+(isClickable?' clickable':'')+'"'+clickAttr+(isClickable?' title="Ver contactos"':'')+'><div class="row-head"><span class="name" title="'+escapeHtml(e[0])+'">'+escapeHtml(e[0])+'</span><span class="value">'+e[1]+'</span></div>' +
        '<div class="track"><div class="fill" style="width:'+pct+'%;background:'+color+'"></div></div></div>';
    }).join('');
    var legend = top.map(function(e,i){
      var color = e[0]==='Otros' ? 'var(--chart-other)' : CAT_COLORS[i % CAT_COLORS.length];
      var isClickable = field && e[0]!=='Otros';
      var clickAttr = isClickable ? drillAttr(field, e[0]) : '';
      return '<div class="item'+(isClickable?' clickable':'')+'"'+clickAttr+(isClickable?' title="Ver contactos"':'')+'><span class="swatch" style="background:'+color+'"></span>'+escapeHtml(e[0])+'</div>';
    }).join('');
    return '<div class="barchart">'+rows+'</div><div class="legend">'+legend+'</div>';

  function rankListHtml(dataMap, limit, field){
    var entries = Object.keys(dataMap).map(function(k){ return [k, dataMap[k]]; }).filter(function(e){ return e[1]>0; })
      .sort(function(a,b){ return b[1]-a[1]; }).slice(0, limit||6);
    if(!entries.length) return '<p style="font-size:12.5px;color:var(--ink-muted);">Sin datos todavía.</p>';

  function magnitudeBarsHtml(items, colorFn, fixedMax){
    if(!items.length) return '<p style="font-size:12.5px;color:var(--ink-muted);">Sin ferias registradas todavía.</p>';
    var max = fixedMax || Math.max.apply(null, items.map(function(i){ return i.value; }).concat([1]));
    return '<div class="barchart">' + items.map(function(it){
      var color = colorFn ? colorFn(it) : 'var(--accent-2)';
      var pct = Math.max(2, Math.round(100*it.value/max));

        '<div class="labels"><span>'+escapeHtml(label)+'</span><span>Sin datos</span></div></div>';
    }
    var color = pct>=70 ? 'var(--good)' : pct>=40 ? 'var(--warn)' : 'var(--bad)';
    return '<div class="prop-bar"><div class="track"><div class="fill" style="width:'+pct+'%;background:'+color+'"></div></div>' +
      '<div class="labels"><span>'+escapeHtml(label)+'</span><span>'+pct+'%</span></div></div>';
  }

  function scoreBarHtml(score, label){
    if(score===null || score===undefined) return propBarHtml(null, label);
    var pct = Math.round((score/5)*100);
    var color = score>=4 ? 'var(--good)' : score>=2.75 ? 'var(--warn)' : 'var(--bad)';
    return '<div class="prop-bar"><div class="track"><div class="fill" style="width:'+pct+'%;background:'+color+'"></div></div>' +
      '<div class="labels"><span>'+escapeHtml(label)+'</span><span>'+score.toFixed(1)+'/5</span></div></div>';
  }

  function progressColor(pct){ return pct>=100 ? 'var(--good)' : pct>=50 ? 'var(--accent-2)' : 'var(--warn)'; }

  function miniProgressHtml(pct){
    return '<div style="display:flex;align-items:center;gap:7px;">' +
      '<div style="width:56px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;flex:none;">' +
        '<div style="width:'+pct+'%;height:100%;background:'+progressColor(pct)+';border-radius:3px;"></div></div>' +
      '<span class="mono" style="font-size:11px;color:var(--ink-muted);">'+pct+'%</span></div>';
  }

  function progressBarHtml(pct, label){
    return '<div class="prop-bar"><div class="track"><div class="fill" style="width:'+pct+'%;background:'+progressColor(pct)+'"></div></div>' +
      '<div class="labels"><span>'+escapeHtml(label||'Avance general')+'</span><span>'+pct+'%</span></div></div>';
  }

  function progressChecklistHtml(milestones){
    var doneIcon = '<svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M20 7L9.5 17.5 4 12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var pendingIcon = '<svg viewBox="0 0 24 24" fill="none" width="16" height="16"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/></svg>';
    return '<div style="display:flex;flex-direction:column;gap:8px;margin-top:14px;">' + milestones.map(function(m){
      return '<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:'+(m.done?'var(--ink)':'var(--ink-muted)')+';">' +
        '<span style="color:'+(m.done?'var(--good)':'var(--ink-faint)')+';display:flex;">'+(m.done?doneIcon:pendingIcon)+'</span>' +
        escapeHtml(m.label) + '</div>';
    }).join('') + '</div>';

  function computeProgress(eventId){
    var contacts = state.contactsByEvent[eventId] || [];
    var execs = getExecList(eventId);
    var surveys = state.surveysByEvent[eventId] || [];
    var milestones = [
      { key:'contactos', label:'Contactos cargados', done: contacts.length>0 },
      { key:'equipo', label:'Equipo comercial asignado', done: execs.length>0 },
      { key:'encuestas', label:'Encuestas completas ('+surveys.length+' de '+execs.length+')', done: execs.length>0 && surveys.length>=execs.length }
    ];
    var doneCount = milestones.filter(function(m){ return m.done; }).length;
    return { milestones: milestones, pct: Math.round(100*doneCount/milestones.length), surveysDone: surveys.length, surveysTotal: execs.length };
  }

  /* Once a fair's report reaches 100% (contacts + team + all surveys), copying
     or downloading it records reportSentAt/reportSentTo on the shared event
     doc so every viewer sees the "ya enviado" state instead of the banner. */
  function markReportSentIfComplete(eventId, to){
    var progress = computeProgress(eventId);
    if(progress.pct === 100){
      updateEvent(eventId, { reportSentAt: new Date().toISOString(), reportSentTo: to });
    }
  }

  function computeVerdict(summary){
    var have = summary.avgApreciacion!==null || summary.pctVolver!==null || summary.pctStand!==null;
    if(!have){
      return { level:'neutral', title:'Todavía sin encuesta comercial',
        text:'Registra las respuestas del equipo comercial en "Encuesta comercial" para calcular si valió la pena este evento.' };
    }
    var sum=0, n=0;
    if(summary.avgApreciacion!==null){ sum += summary.avgApreciacion/5; n++; }
    if(summary.pctVolver!==null){ sum += summary.pctVolver/100; n++; }
    if(summary.pctStand!==null){ sum += summary.pctStand/100; n++; }
    var score = n ? sum/n : null;
    if(score===null) return { level:'neutral', title:'Sin datos suficientes', text:'Completa la encuesta comercial para obtener una recomendación.' };
    if(score>=0.75){
      return { level:'good', title:'Vale la pena repetir e invertir en un stand',
        text:'El equipo comercial calificó bien el evento' + (summary.pctVolver!==null ? ' ('+summary.pctVolver+'% volvería)':'') +
          (summary.pctStand!==null ? ' y '+summary.pctStand+'% invertiría en un stand la próxima edición':'') +
          '. Con '+summary.contactCount+' contacto(s) capturados, la señal es positiva para repetir.' };
    }
    if(score>=0.5){
      return { level:'warn', title:'Evaluar con cautela antes de repetir',
        text:'Las señales del equipo comercial son mixtas. Conviene revisar el costo del stand frente a los contactos y respuestas obtenidas antes de comprometer presupuesto para la próxima edición.' };
    }
    return { level:'bad', title:'No se recomienda repetir sin cambios',
      text:'La apreciación y disposición del equipo comercial fueron bajas. Si se repite, conviene renegociar el formato de participación o el tipo de stand.' };
  }

  /* Builds the plain-text summary shared by "copy" and "download". The
     artifact viewer's sandbox blocks a page from navigating itself to a
     mailto: link (it shows its own "blocked" page in place of the app), so
     we never attempt that navigation — copying/downloading the text for the
     person to paste into their own mail client is the reliable path here. */
  function buildReportEmailParts(eventId){
    var ev = state.events.find(function(e){ return e.id===eventId; });
    if(!ev) return null;
    var contacts = state.contactsByEvent[eventId] || [];
    var surveys = state.surveysByEvent[eventId] || [];
    var summary = computeEventSummary(contacts, surveys, ev.assignedExecs);
    var verdict = computeVerdict(summary);
    var recipientCbs = document.querySelectorAll('.report-recipient-cb:checked');
    var toList = recipientCbs.length ? Array.prototype.map.call(recipientCbs, function(cb){ return cb.value; }) : DEFAULT_REPORT_RECIPIENTS.slice();
    var to = toList.join(', ');

    var execBreakdown = getExecList(eventId).map(function(ex){
      var s = surveys.find(function(sv){ return sv.id===ex.slug; });
      return {
        name: ex.name, count: ex.count,
        apreciacion: s ? s.apreciacion : null,
        volveria: s ? s.volveria : null,
        standInvertir: s ? s.standInvertir : null
      };
    });
    var ubicacionTop = topEntries(categoryMap(contacts, 'ubicacion'), 5);
    var servicioTop = topEntries(categoryMap(contacts, 'servicio'), 5);
    var comentarios = surveys.filter(function(s){ return (s.comentario||'').trim(); })
      .map(function(s){ return { name: s.ejecutivo, text: s.comentario.trim() }; });

    var YN = {si:'Sí', tal_vez:'Tal vez', no:'No'};
    var lines = [];
    lines.push('Reporte de feria: ' + ev.name);
    if(ev.startDate) lines.push('Fecha: ' + fmtDateRange(ev.startDate, ev.endDate));
    if(ev.location) lines.push('Ubicación: ' + ev.location);
    lines.push('');
    lines.push('Contactos capturados: ' + summary.contactCount);
    lines.push('Ejecutivos participantes: ' + summary.execCount);
    lines.push('Valor potencial estimado: ' + fmtUsd(summary.totalPrice));
    lines.push('Apreciación del equipo: ' + (summary.avgApreciacion!==null ? summary.avgApreciacion.toFixed(1)+'/5' : 'sin datos aún'));
    lines.push('¿Volvería al evento?: ' + (summary.pctVolver!==null ? summary.pctVolver+'%' : 'sin datos aún'));
    lines.push('¿Invertiría en stand?: ' + (summary.pctStand!==null ? summary.pctStand+'%' : 'sin datos aún'));
    lines.push('');
    lines.push('Veredicto: ' + verdict.title);
    lines.push(verdict.text);
    if(execBreakdown.length){
      lines.push('');
      lines.push('Desglose por ejecutivo:');
      execBreakdown.forEach(function(ex){
        lines.push('- ' + ex.name + ': ' + ex.count + ' contacto(s)' +
          (ex.apreciacion!==null ? ', apreciación ' + ex.apreciacion + '/5' : ', sin encuesta') +
          (ex.volveria ? ', volvería: ' + (YN[ex.volveria]||ex.volveria) : '') +
          (ex.standInvertir ? ', stand: ' + (YN[ex.standInvertir]||ex.standInvertir) : ''));
      });
    }
    if(ubicacionTop.length){
      lines.push('');
      lines.push('Top ubicaciones: ' + ubicacionTop.map(function(e){ return e[0]+' ('+e[1]+')'; }).join(', '));
    }
    if(servicioTop.length){
      lines.push('Servicios más solicitados: ' + servicioTop.map(function(e){ return e[0]+' ('+e[1]+')'; }).join(', '));
    }
    if(comentarios.length){
      lines.push('');
      lines.push('Comentarios del equipo comercial:');
      comentarios.forEach(function(c){ lines.push('- ' + c.name + ': "' + c.text + '"'); });
    }
    lines.push('');
    lines.push('Reporte completo y actualizado:');
    var link = location.href.split('#')[0] + '#' + eventId + '/reporte';
    lines.push(link);
    return { to: to, subject: 'Reporte de feria: ' + ev.name, body: lines.join('\n'), eventName: ev.name,
      ev: ev, summary: summary, verdict: verdict, link: link,
      execBreakdown: execBreakdown, ubicacionTop: ubicacionTop, servicioTop: servicioTop, comentarios: comentarios };
  }

  function topEntries(dataMap, limit){
    return Object.keys(dataMap).map(function(k){ return [k, dataMap[k]]; }).filter(function(e){ return e[1]>0; })
      .sort(function(a,b){ return b[1]-a[1]; }).slice(0, limit||5);
  }

  function copyTextToClipboard(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text).catch(function(){ return legacyCopy(text); });
    }
    return legacyCopy(text);
  }
  function copyHtmlToClipboard(html, text){
    if(navigator.clipboard && navigator.clipboard.write && typeof ClipboardItem!=='undefined'){
      try{
        var item = new ClipboardItem({
          'text/html': new Blob([html], {type:'text/html'}),
          'text/plain': new Blob([text], {type:'text/plain'})
        });
        return navigator.clipboard.write([item]).catch(function(){ return copyTextToClipboard(text); });
      }catch(e){ return copyTextToClipboard(text); }
    }
    return copyTextToClipboard(text);
  }
  function legacyCopy(text){
    return new Promise(function(resolve, reject){
      try{
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error('copy failed'));
      }catch(e){ reject(e); }
    });
  }

  function populateEventSelect(){
    var sel = document.getElementById('eventSelect');
    if(!state.events.length){
      sel.innerHTML = '<option value="">Sin ferias registradas</option>';
      sel.value = '';
      return;
    }
    sel.innerHTML = state.events.map(function(ev){
      return '<option value="'+ev.id+'">'+escapeHtml(ev.name)+(ev.startDate? ' · '+fmtDateRange(ev.startDate, ev.endDate):'')+'</option>';
    }).join('');
    sel.value = state.currentEventId || '';
  }

  function renderTopbar(){
    var ev = currentEvent();
    var title = document.getElementById('eventTitle');
    var sub = document.getElementById('eventSub');
    var actions = document.getElementById('topbarActions');
    if(!ev){
      title.textContent = state.events.length ? 'Selecciona una feria' : 'Ninguna feria todavía';
      sub.innerHTML = '';
      actions.innerHTML = '';
      return;
    }
    title.textContent = ev.name;
    var bits = [];
    if(ev.startDate) bits.push('<span><svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9.5h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'+fmtDateRange(ev.startDate, ev.endDate)+'</span>');
    if(ev.location) bits.push('<span><svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9.5" r="2.3" stroke="currentColor" stroke-width="1.6"/></svg>'+escapeHtml(ev.location)+'</span>');
    var contactCount = (state.contactsByEvent[ev.id]||[]).length;
    bits.push('<span><svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/></svg>'+contactCount+' contacto'+(contactCount===1?'':'s')+'</span>');
    var progress = computeProgress(ev.id);
    bits.push('<span title="Estado del reporte"><svg viewBox="0 0 24 24" fill="none"><path d="M4 19V5M4 19h16M8 15v-4m4 4V9m4 6v-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Reporte '+progress.pct+'%</span>');
    sub.innerHTML = bits.join('');
    actions.innerHTML = '<button class="btn btn-ghost btn-sm" onclick="App.openEventModal(true)">Editar feria</button>';
  }

  function setActiveTab(tab){
    state.activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===tab); });
    document.querySelectorAll('section.view').forEach(function(v){ v.hidden = v.id !== 'view-'+tab; });
    renderCurrentView();
  }

  function renderCurrentView(){
    if(state.activeTab==='resumen') renderResumen();
    else if(state.activeTab==='contactos') renderContactos();
    else if(state.activeTab==='encuesta') renderEncuesta();
    else if(state.activeTab==='reporte') renderReporte();
  }

  function renderAll(){
    populateEventSelect();
    renderTopbar();
    renderCurrentView();
  }

  /* ---------------------------------------------------------------- */

  function renderResumen(){
    var el = document.getElementById('view-resumen');
    if(!state.events.length){
      el.innerHTML = '<div class="panel"><div class="empty-state">' +
        '<svg viewBox="0 0 24 24" fill="none"><path d="M4 19V5M4 19h16M8 15v-4m4 4V9m4 6v-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '<h3>Todavía no registras ninguna feria</h3>' +
        '<p>Crea tu primera feria para empezar a cargar contactos, recoger la encuesta del equipo comercial y generar el reporte para gerencia.</p>' +
        '<button class="btn btn-primary" onclick="App.openEventModal()">Crear mi primera feria</button>' +
        '</div></div>';
      return;
    }
    var events = state.events.slice();
    var withSummary = events.map(function(e){ return Object.assign({}, e, { summary: e.summary || computeEventSummary(state.contactsByEvent[e.id], state.surveysByEvent[e.id], e.assignedExecs) }); });

    var totalFerias = withSummary.length;
    var totalContactos = withSummary.reduce(function(a,e){ return a + (e.summary.contactCount||0); }, 0);
    var scored = withSummary.filter(function(e){ return e.summary.avgApreciacion!==null; });
    var avgGlobal = scored.length ? scored.reduce(function(a,e){ return a+e.summary.avgApreciacion; },0)/scored.length : null;
    var volverArr = withSummary.filter(function(e){ return e.summary.pctVolver!==null; });
    var avgVolver = volverArr.length ? Math.round(volverArr.reduce(function(a,e){ return a+e.summary.pctVolver; },0)/volverArr.length) : null;

    var chrono = withSummary.slice().sort(function(a,b){ return (a.startDate||a.createdAt||'').localeCompare(b.startDate||b.createdAt||''); });
    var contactsItems = chrono.map(function(e){ return { label:e.name, value:e.summary.contactCount||0, displayValue:e.summary.contactCount||0 }; });
    var satisItems = chrono.map(function(e){
      var v = e.summary.avgApreciacion;
      return { label:e.name, value: v||0, raw:v, displayValue: v!==null&&v!==undefined ? v.toFixed(1)+'/5' : '—' };
    });
    function satisColor(it){
      if(it.raw===null || it.raw===undefined) return 'var(--ink-faint)';
      return it.raw>=4 ? 'var(--good)' : it.raw>=2.75 ? 'var(--warn)' : 'var(--bad)';
    }

    var tableRows = events.slice().sort(function(a,b){ return (b.startDate||b.createdAt||'').localeCompare(a.startDate||a.createdAt||''); }).map(function(e){
      var s = e.summary || computeEventSummary(state.contactsByEvent[e.id], state.surveysByEvent[e.id], e.assignedExecs);
      return '<tr>' +
        '<td class="wrap" style="font-weight:600;">'+escapeHtml(e.name)+'</td>' +
        '<td>'+ (e.startDate? fmtDateRange(e.startDate, e.endDate) : '—') +'</td>' +
        '<td class="wrap">'+escapeHtml(e.location||'—')+'</td>' +
        '<td class="num">'+ (s.contactCount||0) +'</td>' +
        '<td>'+ miniProgressHtml(s.progressPct||0) +'</td>' +
        '<td class="num">'+ (s.avgApreciacion!==null&&s.avgApreciacion!==undefined ? s.avgApreciacion.toFixed(1)+'/5' : '—') +'</td>' +
        '<td class="num">'+ (s.pctVolver!==null&&s.pctVolver!==undefined ? s.pctVolver+'%' : '—') +'</td>' +
        '<td class="num">'+ (s.pctStand!==null&&s.pctStand!==undefined ? s.pctStand+'%' : '—') +'</td>' +
        '<td style="display:flex;gap:6px;">' +
          '<button class="btn btn-ghost btn-sm" onclick="App.verReporte(\''+e.id+'\')">Ver reporte</button>' +
          '<button class="btn btn-ghost btn-sm" title="Eliminar feria" onclick="App.confirmDeleteEvent(\''+e.id+'\')">' +
            '<svg viewBox="0 0 24 24" fill="none" width="14" height="14"><path d="M5 7h14M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '</button>' +
        '</td>' +
        '</tr>';
    }).join('');

    el.innerHTML =
      '<div class="kpi-row">' +
        '<div class="kpi"><div class="kpi-label">Ferias registradas</div><div class="kpi-value">'+fmtInt(totalFerias)+'</div></div>' +
        '<div class="kpi"><div class="kpi-label">Contactos totales</div><div class="kpi-value">'+fmtInt(totalContactos)+'</div></div>' +
        '<div class="kpi"><div class="kpi-label">Apreciación promedio</div><div class="kpi-value">'+(avgGlobal!==null? avgGlobal.toFixed(1)+'/5':'—')+'</div></div>' +
        '<div class="kpi"><div class="kpi-label">Volvería en promedio</div><div class="kpi-value">'+(avgVolver!==null? avgVolver+'%':'—')+'</div></div>' +
      '</div>' +
      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-head"><div><h3>Evolución de contactos por feria</h3><p class="hint">De la feria más antigua a la más reciente</p></div></div>' + magnitudeBarsHtml(contactsItems, null, null) + '</div>' +
        '<div class="panel"><div class="panel-head"><div><h3>Satisfacción del equipo por feria</h3><p class="hint">Apreciación promedio, escala 0–5</p></div></div>' + magnitudeBarsHtml(satisItems, satisColor, 5) + '</div>' +
      '</div>' +
      '<div class="panel">' +
        '<div class="panel-head"><div><h3>Todas las ferias</h3><p class="hint">Haz clic en "Ver reporte" para el detalle de cada evento</p></div></div>' +
        '<div class="table-wrap"><table><thead><tr><th>Feria</th><th>Fecha</th><th>Ubicación</th><th>Contactos</th><th>Progreso</th><th>Apreciación</th><th>Volvería</th><th>Stand</th><th></th></tr></thead><tbody>' + tableRows + '</tbody></table></div>' +
      '</div>';
  }

  var CONTACT_TABLE_FIELDS = ['nombre','empresa','ubicacion','servicio','ejecutivo','contactoVia','normas','precioAprox','telefono','correo','notas'];

  function contactsTableHtml(rows, opts){
    opts = opts || {};
    if(!rows.length) return '<p style="font-size:12.5px;color:var(--ink-muted);">Todavía no hay contactos cargados para esta feria.</p>';
    var shown = opts.limit ? rows.slice(0, opts.limit) : rows;
    var head = CONTACT_TABLE_FIELDS.map(function(f){ return '<th>'+FIELD_LABELS[f]+'</th>'; }).join('');
    var body = shown.map(function(r){
      return '<tr>' + CONTACT_TABLE_FIELDS.map(function(f){
        var cls = (f==='notas') ? ' class="wrap"' : '';
        return '<td'+cls+'>'+escapeHtml(r[f]||'—')+'</td>';
      }).join('') + '</tr>';
    }).join('');
    var more = (opts.limit && rows.length>opts.limit) ? '<p style="font-size:12px;color:var(--ink-muted);margin-top:8px;">y '+(rows.length-opts.limit)+' más…</p>' : '';
    return '<div class="table-wrap"><table><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>' + more;
  }

          '<svg viewBox="0 0 24 24" fill="none"><path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>' +
