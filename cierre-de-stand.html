  /* ---------------------------------------------------------------- */
  /* view: encuesta                                                     */
  /* ---------------------------------------------------------------- */
  var SCALE_LABELS = ['Muy mala','Mala','Regular','Buena','Excelente'];

  /* Replaces a container's innerHTML while keeping whatever input/textarea
     the user is currently focused on (and their cursor position) focused
     afterwards. Full-page re-renders can arrive at any moment from a live
     onSnapshot (someone else's edit, or our own cached-summary write) —
     without this, one of those re-renders mid-keystroke silently steals
     focus and makes an in-progress answer look like it "un-selected". */
  function setHtmlPreservingFocus(el, html){
    var active = document.activeElement;
    var restore = null;
    if(active && el.contains(active) && active.id && (active.tagName==='TEXTAREA' || active.tagName==='INPUT')){
      restore = {
        id: active.id,
        start: (typeof active.selectionStart==='number') ? active.selectionStart : null,
        end: (typeof active.selectionEnd==='number') ? active.selectionEnd : null,
        scrollTop: el.scrollTop
      };
    }
    el.innerHTML = html;
    if(restore){
      var again = document.getElementById(restore.id);
      if(again){
        again.focus();
        if(restore.start!==null && again.setSelectionRange){
          try{ again.setSelectionRange(restore.start, restore.end); }catch(e){}
        }
      }
      el.scrollTop = restore.scrollTop;
    }
  }

  function segButtonsHtml(slug, field, options, current){
    return '<div class="seg">' + options.map(function(opt){
      var sel = current===opt.value ? ' sel' : '';
      return '<button type="button" class="'+sel.trim()+'" onclick="App.segClick(\''+slug+'\',\''+field+'\',\''+opt.value+'\')">'+opt.label+'</button>';
    }).join('') + '</div>';
  }

  function renderEncuesta(){
    var el = document.getElementById('view-encuesta');
    var ev = currentEvent();
    if(!ev){
      setHtmlPreservingFocus(el, '<div class="panel"><div class="empty-state">' +
        '<svg viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 1 1-3.2-6.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
        '<h3>Elige o crea una feria primero</h3><p>La encuesta comercial se responde por feria.</p>' +
        '<button class="btn btn-primary" onclick="App.openEventModal()">Crear feria</button>' +
        '</div></div>');
      return;
    }
    var execs = getExecList(ev.id);
    var surveys = state.surveysByEvent[ev.id] || [];
    var assignedSet = {};
    (ev.assignedExecs||[]).forEach(function(s){ assignedSet[s]=true; });

    var rosterChecklist = state.execRoster.map(function(p){
      var checked = !!assignedSet[p.slug];
      return '<label class="roster-item"><input type="checkbox" '+(checked?'checked':'')+
        ' onchange="App.setExecAssigned(\''+ev.id+'\',\''+p.slug+'\', this.checked)">' +
        '<span class="info"><strong>'+escapeHtml(p.name)+'</strong><small>'+escapeHtml(p.email||'')+'</small></span></label>';
    }).join('');

    var addRosterBlock = state.showAddRoster ? (
      '<div class="add-roster-form">' +
        '<input type="text" id="newRosterName" placeholder="Nombre completo">' +
        '<input type="email" id="newRosterEmail" placeholder="Correo (opcional)">' +
        '<button class="btn btn-primary btn-sm" onclick="App.addRosterMember(\''+ev.id+'\')">Agregar al equipo</button>' +
        '<button class="btn btn-ghost btn-sm" onclick="App.toggleAddRoster()">Cancelar</button>' +
      '</div>'
    ) : '<button class="btn btn-ghost btn-sm" style="margin-top:12px;" onclick="App.toggleAddRoster()">+ Agregar nuevo comercial al equipo</button>';

    var cards = execs.map(function(ex){
      var existing = surveys.find(function(s){ return s.id===ex.slug; });
      var isOpen = state.openExecSlug===ex.slug;
      var draft = state.surveyDraft[ex.slug] || { apreciacion:null, volveria:null, standInvertir:null, comentario:'' };
      var metaBits = [ex.count+' contacto(s) capturado(s) en esta feria'];
      if(ex.email) metaBits.push(escapeHtml(ex.email));
      var head = '<div class="exec-head">' +
        '<div><div class="exec-name">'+escapeHtml(ex.name)+'</div><div class="exec-meta">'+metaBits.join(' · ')+'</div></div>' +
        (existing
          ? '<span class="badge good">Encuesta respondida</span>'
          : '<span class="badge neutral">Pendiente</span>') +
        '</div>';
      var summaryLine = existing ? (
        '<div class="exec-done">' +
          '<span>Apreciación: <strong>'+existing.apreciacion+'/5</strong></span>' +
          '<span>Volvería: <strong>'+({si:'Sí',tal_vez:'Tal vez',no:'No'}[existing.volveria]||'—')+'</strong></span>' +
          '<span>Stand: <strong>'+({si:'Sí',tal_vez:'Tal vez',no:'No'}[existing.standInvertir]||'—')+'</strong></span>' +
        '</div>'
      ) : '';
      var toggleBtn = '<button class="btn btn-sm '+(existing?'btn-ghost':'btn-primary')+'" style="margin-top:10px;" onclick="App.toggleExec(\''+ex.slug+'\')">'+(isOpen?'Cerrar':(existing?'Editar respuesta':'Responder encuesta'))+'</button>';
      var form = '';
      if(isOpen){
        form = '<div class="exec-form">' +
          '<div><span class="q-label">1. ¿Cómo calificarías el evento en general?</span>' +
            segButtonsHtml(ex.slug, 'apreciacion', [1,2,3,4,5].map(function(n){ return {value:String(n), label:n+' · '+SCALE_LABELS[n-1]}; }), draft.apreciacion!==null?String(draft.apreciacion):null) +
          '</div>' +
          '<div><span class="q-label">2. ¿Recomendarías volver a este evento?</span>' +
            segButtonsHtml(ex.slug, 'volveria', [{value:'si',label:'Sí'},{value:'tal_vez',label:'Tal vez'},{value:'no',label:'No'}], draft.volveria) +
          '</div>' +
          '<div><span class="q-label">3. ¿Recomendarías invertir en un stand en la próxima edición?</span>' +
            segButtonsHtml(ex.slug, 'standInvertir', [{value:'si',label:'Sí'},{value:'tal_vez',label:'Tal vez'},{value:'no',label:'No'}], draft.standInvertir) +
          '</div>' +
          '<div><span class="q-label">Comentario (opcional)</span>' +
            '<textarea class="comment" id="comment-'+ex.slug+'" placeholder="Algo que gerencia debería saber sobre este evento…" oninput="App.draftComment(\''+ex.slug+'\', this.value)">'+escapeHtml(draft.comentario||'')+'</textarea>' +
          '</div>' +
          '<div><button class="btn btn-primary" onclick="App.saveSurvey(\''+ev.id+'\',\''+ex.slug+'\')">Guardar respuesta</button></div>' +
        '</div>';
      }
      return '<div class="exec-card">' + head + summaryLine + toggleBtn + form + '</div>';
    }).join('');

    setHtmlPreservingFocus(el,
      '<div class="panel">' +
        '<div class="panel-head"><div><h3>Equipo comercial en esta feria</h3><p class="hint">Marca quiénes participaron. Puedes hacerlo desde ahora, incluso antes de cargar contactos.</p></div></div>' +
        '<div class="roster-grid">'+rosterChecklist+'</div>' +
        addRosterBlock +
      '</div>' +
      '<div class="panel">' +
        '<div class="panel-head"><div><h3>Encuesta del equipo comercial</h3><p class="hint">Cada comercial responde una sola vez por feria: cómo le fue, si volvería y si invertiría en stand.</p></div></div>' +
        (execs.length ? '<div class="exec-list">'+cards+'</div>' : '<p style="font-size:12.5px;color:var(--ink-muted);">Todavía no hay nadie asignado a esta feria. Marca al equipo arriba o carga los contactos.</p>') +
      '</div>');
  }

  /* ---------------------------------------------------------------- */
  /* view: reporte                                                      */
  /* ---------------------------------------------------------------- */
  function renderReporte(){
    var el = document.getElementById('view-reporte');
    var ev = currentEvent();
    if(!ev){
      el.innerHTML = '<div class="panel"><div class="empty-state">' +
        '<svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="3.5" width="17" height="17" rx="3" stroke="currentColor" stroke-width="1.6"/></svg>' +
        '<h3>Elige o crea una feria primero</h3><p>El reporte se genera a partir de los contactos y la encuesta de una feria.</p>' +
        '<button class="btn btn-primary" onclick="App.openEventModal()">Crear feria</button>' +
        '</div></div>';
      return;
    }
    var contacts = state.contactsByEvent[ev.id] || [];
    var surveys = state.surveysByEvent[ev.id] || [];
    var summary = computeEventSummary(contacts, surveys, ev.assignedExecs);
    var progress = computeProgress(ev.id);

    var progressPanel =
      '<div class="panel">' +
        '<div class="panel-head"><div><h3>Estado del reporte</h3><p class="hint">'+progress.surveysDone+' de '+progress.surveysTotal+' comerciales han respondido la encuesta</p></div></div>' +
        progressBarHtml(progress.pct, 'Avance general') +
        progressChecklistHtml(progress.milestones) +
      '</div>';

    if(!contacts.length && !surveys.length){
      el.innerHTML = progressPanel + '<div class="panel"><div class="empty-state">' +
        '<svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="3.5" width="17" height="17" rx="3" stroke="currentColor" stroke-width="1.6"/></svg>' +
        '<h3>Aún no hay datos para "'+escapeHtml(ev.name)+'"</h3>' +
        '<p>Carga los contactos capturados y pide al equipo comercial que responda la encuesta para generar el reporte.</p>' +
        '</div></div>';
      return;
    }

    var others = state.events.filter(function(e){ return e.id!==ev.id; }).map(function(e){ return e.summary; }).filter(Boolean);
    var avgOthers = others.length ? others.reduce(function(a,s){ return a+(s.contactCount||0); },0)/others.length : null;
    var delta = (avgOthers!==null) ? Math.round(summary.contactCount - avgOthers) : null;

    var execMap = categoryMap(contacts, 'ejecutivo');
    var servicioMap = categoryMap(contacts, 'servicio');
    var ubicacionMap = categoryMap(contacts, 'ubicacion');
    var canalMap = categoryMap(contacts, 'contactoVia');
    var normasMap = categoryMap(contacts, 'normas', /[,;\/]+/);

    var verdict = computeVerdict(summary);
    var commentedSurveys = surveys.filter(function(s){ return (s.comentario||'').trim(); });
    var recipientChecklist = state.execRoster.map(function(p){
      var checked = DEFAULT_REPORT_RECIPIENTS.indexOf(p.email) >= 0;
      return '<label class="recipient-item"><input type="checkbox" class="report-recipient-cb" value="'+escapeHtml(p.email)+'"'+(checked?' checked':'')+'>'+escapeHtml(p.name)+'</label>';
    }).join('');

    var reportComplete = progress.pct === 100;
    var sendBanner = '';
    if(reportComplete && !ev.reportSentAt){
      sendBanner =
        '<div class="send-banner">' +
          '<div class="icon"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
          '<div class="text"><h4>Reporte completo — listo para enviar</h4>' +
            '<p>Todos los contactos, el equipo y las encuestas de "'+escapeHtml(ev.name)+'" están cargados. Envíalo ahora a Guillermo Godiño y Micaela Cervantes.</p></div>' +
          '<button type="button" class="btn btn-primary" onclick="App.copyReportEmail(\''+ev.id+'\')">Copiar y enviar reporte</button>' +
        '</div>';
    } else if(ev.reportSentAt){
      sendBanner =
        '<div class="send-note">' +
          '<svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '<span>Reporte enviado el '+escapeHtml(fmtDateTime(ev.reportSentAt))+(ev.reportSentTo?' a '+escapeHtml(ev.reportSentTo):'')+'.</span>' +
        '</div>';
    }

    el.innerHTML =
      progressPanel +
      (sendBanner ? sendBanner : '') +
      '<div class="kpi-row">' +
        '<div class="kpi"><div class="kpi-label">Contactos capturados</div><div class="kpi-value">'+fmtInt(summary.contactCount)+'</div>' +
          (delta!==null ? '<div class="kpi-delta '+(delta>=0?'good':'bad')+'">'+(delta>=0?'+':'')+delta+' vs. promedio histórico</div>' : '') +
        '</div>' +
        '<div class="kpi"><div class="kpi-label">Ejecutivos participantes</div><div class="kpi-value">'+fmtInt(summary.execCount)+'</div></div>' +
        '<div class="kpi"><div class="kpi-label">Valor potencial estimado</div><div class="kpi-value">'+fmtUsd(summary.totalPrice)+'</div>' +
          '<div class="kpi-delta">según precios aproximados registrados</div></div>' +
        '<div class="kpi"><div class="kpi-label">Apreciación del equipo</div><div class="kpi-value">'+(summary.avgApreciacion!==null? summary.avgApreciacion.toFixed(1)+'/5':'—')+'</div></div>' +
      '</div>' +

      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-head"><div><h3>Contactos por ejecutivo</h3><p class="hint">Haz clic en un ejecutivo para ver sus contactos.</p></div></div>' + categoricalBarsHtml(execMap, 'ejecutivo') + '</div>' +
        '<div class="panel"><div class="panel-head"><div><h3>Contactos por servicio</h3><p class="hint">Haz clic en un servicio para ver sus contactos.</p></div></div>' + categoricalBarsHtml(servicioMap, 'servicio') + '</div>' +
      '</div>' +

      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-head"><div><h3>Top ubicaciones</h3><p class="hint">Haz clic en una ubicación para ver sus contactos.</p></div></div>' + rankListHtml(ubicacionMap, 6, 'ubicacion') + '</div>' +
        '<div class="panel"><div class="panel-head"><div><h3>Canal de contacto</h3></div></div>' + rankListHtml(canalMap, 6, 'contactoVia') + '</div>' +
      '</div>' +

      '<div class="panel"><div class="panel-head"><div><h3>Normas / certificaciones de interés</h3><p class="hint">Haz clic en una norma para ver sus contactos.</p></div></div>' + rankListHtml(normasMap, 8, 'normas') + '</div>' +

      '<div class="panel">' +
        '<div class="panel-head"><div><h3>Disposición del equipo comercial</h3></div></div>' +
        '<div class="grid-2">' +
          '<div>' + scoreBarHtml(summary.avgApreciacion, 'Apreciación general') + '</div>' +
          '<div>' + propBarHtml(summary.pctVolver, '¿Volvería al evento?') + '</div>' +
        '</div>' +
        '<div style="margin-top:14px;">' + propBarHtml(summary.pctStand, '¿Invertiría en stand la próxima edición?') + '</div>' +
      '</div>' +

      '<div class="verdict-card '+verdict.level+'">' +
        '<div class="icon">'+VERDICT_ICONS[verdict.level]+'</div>' +
        '<div><h4>'+escapeHtml(verdict.title)+'</h4><p>'+escapeHtml(verdict.text)+'</p></div>' +
      '</div>' +

      (commentedSurveys.length ? (
        '<div class="panel"><div class="panel-head"><div><h3>Comentarios del equipo comercial</h3></div></div>' +
        '<div style="display:flex;flex-direction:column;gap:10px;">' + commentedSurveys.map(function(s){
          return '<div style="border-left:3px solid var(--accent-2);padding:4px 0 4px 12px;">' +
            '<div style="font-size:12.5px;font-weight:600;">'+escapeHtml(s.ejecutivo)+'</div>' +
            '<div style="font-size:13px;color:var(--ink-muted);">'+escapeHtml(s.comentario)+'</div></div>';
        }).join('') + '</div></div>'
      ) : '') +

      '<div class="panel">' +
        '<div class="panel-head"><div><h3>Compartir reporte</h3><p class="hint">Copia el reporte con diseño (logo, KPIs y veredicto) y pégalo con Ctrl/Cmd+V directo en un correo nuevo para los destinatarios marcados — Gmail y Outlook conservan el formato.</p></div></div>' +
        '<div style="margin-bottom:12px;"><div class="recipient-list">' + recipientChecklist + '</div></div>' +
        '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">' +
          '<button class="btn btn-primary" onclick="App.copyReportEmail(\''+ev.id+'\')">Copiar reporte</button>' +
          '<button class="btn btn-ghost" onclick="App.downloadReportEmail(\''+ev.id+'\')">Descargar (.html)</button>' +
        '</div>' +
      '</div>';
  }

  /* ---------------------------------------------------------------- */
  /* App namespace — handlers referenced from inline templates          */
  /* ---------------------------------------------------------------- */
  window.App = {
    openEventModal: function(editCurrent){
      var existing = editCurrent ? currentEvent() : null;
      var isEdit = !!existing;
      document.getElementById('modalRoot').innerHTML =
        '<div class="modal-backdrop" onclick="if(event.target===this) App.closeModal()">' +
          '<div class="modal">' +
            '<h3>'+(isEdit?'Editar feria':'Nueva feria')+'</h3>' +
            '<form id="eventForm">' +
              '<div class="field" style="margin-bottom:12px;"><label>Nombre de la feria *</label>' +
                '<input required id="fEventName" value="'+escapeHtml(existing?existing.name:'')+'" placeholder="Ej. ExpoIndustria Perú 2026"></div>' +
              '<div style="display:flex;gap:10px;margin-bottom:12px;">' +
                '<div class="field" style="flex:1;"><label>Fecha de inicio</label>' +
                  '<input type="date" id="fEventStartDate" value="'+(existing&&existing.startDate?existing.startDate:'')+'"></div>' +
                '<div class="field" style="flex:1;"><label>Fecha de fin (opcional)</label>' +
                  '<input type="date" id="fEventEndDate" value="'+(existing&&existing.endDate?existing.endDate:'')+'"></div>' +
              '</div>' +
              '<div class="field" style="margin-bottom:12px;"><label>Ubicación</label>' +
                '<input id="fEventLocation" value="'+escapeHtml(existing?existing.location:'')+'" placeholder="Ej. Lima, Perú"></div>' +
              '<div class="field"><label>Notas (opcional)</label>' +
                '<textarea id="fEventNotes" placeholder="Stand, presupuesto, objetivo…">'+escapeHtml(existing?existing.notes:'')+'</textarea></div>' +
              '<div class="actions" style="justify-content:space-between;">' +
                (isEdit ? '<button type="button" class="btn btn-ghost" style="color:var(--bad);border-color:var(--bad-soft);" onclick="App.confirmDeleteEvent(\''+existing.id+'\')">Eliminar feria</button>' : '<span></span>') +
                '<div style="display:flex;gap:8px;">' +
                  '<button type="button" class="btn btn-ghost" onclick="App.closeModal()">Cancelar</button>' +
                  '<button type="submit" class="btn btn-primary">'+(isEdit?'Guardar cambios':'Crear feria')+'</button>' +
                '</div>' +
              '</div>' +
            '</form>' +
          '</div>' +
        '</div>';
      document.getElementById('eventForm').addEventListener('submit', function(e){
        e.preventDefault();
        var name = document.getElementById('fEventName').value.trim();
        if(!name) return;
        var startDate = document.getElementById('fEventStartDate').value || '';
        var endDate = document.getElementById('fEventEndDate').value || '';
        if(startDate && endDate && endDate < startDate){ var tmp = startDate; startDate = endDate; endDate = tmp; }
        var payload = {
          name: name,
          startDate: startDate,
          endDate: endDate,
          location: document.getElementById('fEventLocation').value.trim(),
          notes: document.getElementById('fEventNotes').value.trim()
        };
        if(isEdit){ updateEvent(existing.id, payload); } else { createEvent(payload); }
        App.closeModal();
      });
    },
    confirmDeleteEvent: function(eventId){
      var ev = state.events.find(function(e){ return e.id===eventId; });
      if(!ev) return;
      document.getElementById('modalRoot').innerHTML =
        '<div class="modal-backdrop" onclick="if(event.target===this) App.closeModal()">' +
          '<div class="modal">' +
            '<h3>¿Eliminar "'+escapeHtml(ev.name)+'"?</h3>' +
            '<p style="font-size:13px;color:var(--ink-muted);line-height:1.55;">Se eliminarán también sus contactos, el equipo asignado y las respuestas de la encuesta. Esta acción no se puede deshacer.</p>' +
            '<div class="actions">' +
              '<button type="button" class="btn btn-ghost" onclick="App.closeModal()">Cancelar</button>' +
              '<button type="button" class="btn btn-primary" style="background:var(--bad);" onclick="App.doDeleteEvent(\''+eventId+'\')">Sí, eliminar definitivamente</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    },
    doDeleteEvent: function(eventId){
      deleteEvent(eventId);
      App.closeModal();
    },
    closeModal: function(){ document.getElementById('modalRoot').innerHTML=''; },

    toggleExec: function(slug){
      if(state.openExecSlug===slug){ state.openExecSlug=null; }
      else {
        state.openExecSlug = slug;
        if(!state.surveyDraft[slug]) state.surveyDraft[slug] = { apreciacion:null, volveria:null, standInvertir:null, comentario:'' };
        var existing = (state.surveysByEvent[state.currentEventId]||[]).find(function(s){ return s.id===slug; });
        if(existing){ state.surveyDraft[slug] = { apreciacion:existing.apreciacion, volveria:existing.volveria, standInvertir:existing.standInvertir, comentario:existing.comentario||'' }; }
      }
      renderEncuesta();
    },
    segClick: function(slug, field, value){
      if(!state.surveyDraft[slug]) state.surveyDraft[slug] = { apreciacion:null, volveria:null, standInvertir:null, comentario:'' };
      state.surveyDraft[slug][field] = (field==='apreciacion') ? Number(value) : value;
      renderEncuesta();
    },
    draftComment: function(slug, val){
      if(!state.surveyDraft[slug]) state.surveyDraft[slug] = { apreciacion:null, volveria:null, standInvertir:null, comentario:'' };
      state.surveyDraft[slug].comentario = val;
    },
    saveSurvey: function(eventId, slug){
      var d = state.surveyDraft[slug];
      if(!d || d.apreciacion===null || !d.volveria || !d.standInvertir){ toast('Responde las 3 preguntas antes de guardar.'); return; }
      var exec = getExecList(eventId).find(function(e){ return e.slug===slug; });
      var name = exec ? exec.name : slug;
      submitSurvey(eventId, name, d);
      state.openExecSlug = null;
      delete state.surveyDraft[slug];
      toast('Respuesta guardada.');
      renderEncuesta();
    },
    setExecAssigned: function(eventId, slug, assigned){ setExecAssigned(eventId, slug, assigned); },
    toggleAddRoster: function(){ state.showAddRoster = !state.showAddRoster; renderEncuesta(); },
    addRosterMember: function(eventId){
      var nameInput = document.getElementById('newRosterName');
      var emailInput = document.getElementById('newRosterEmail');
      var name = nameInput ? nameInput.value : '';
      var email = emailInput ? emailInput.value : '';
      if(!(name||'').trim()){ toast('Escribe el nombre del comercial.'); return; }
      addRosterMember(eventId, name, email);
      state.showAddRoster = false;
      toast('Comercial agregado al equipo.');
      renderEncuesta();
    },
    verReporte: function(eventId){
      state.currentEventId = eventId;
      state.parsedUpload = null;
      state.openExecSlug = null;
      state.surveyDraft = {};
      state.showAddRoster = false;
      subscribeEventChildren();
      setActiveTab('reporte');
    },

    onFileInput: function(e){ App.handleFiles(e.target.files); e.target.value=''; },
    onDrop: function(e){ e.preventDefault(); e.currentTarget.classList.remove('drag'); App.handleFiles(e.dataTransfer.files); },
    onDragOver: function(e){ e.preventDefault(); e.currentTarget.classList.add('drag'); },
    onDragLeave: function(e){ e.currentTarget.classList.remove('drag'); },
    handleFiles: function(fileList){
      var file = fileList && fileList[0];
      if(!file) return;
      parseWorkbookFile(file).then(function(rows){
        if(!rows.length){ toast('El archivo no tiene filas de datos.'); return; }
        state.parsedUpload = { fileName: file.name, rows: rows.map(mapRow) };
        renderContactos();
      }).catch(function(err){
        console.error(err);
        toast('No se pudo leer el archivo. Revisa que sea un Excel (.xlsx) o CSV válido.');
      });
    },
    discardUpload: function(){ state.parsedUpload = null; renderContactos(); },
    confirmSaveContacts: function(eventId){
      if(!state.parsedUpload) return;
      var count = state.parsedUpload.rows.length;
      saveContactsToEvent(eventId, state.parsedUpload.rows).then(function(){
        toast(count+' contacto(s) guardado(s).');
        state.parsedUpload = null;
        renderContactos();
        renderTopbar();
      }).catch(function(err){
        console.error(err);
        toast('Ocurrió un error al guardar los contactos.');
      });
    },

    exportContacts: function(eventId){
      var ev = state.events.find(function(e){ return e.id===eventId; });
      var rows = state.contactsByEvent[eventId] || [];
      if(!rows.length){ toast('No hay contactos para exportar.'); return; }
      if(typeof XLSX === 'undefined'){ toast('No se pudo cargar el motor de Excel. Intenta de nuevo.'); return; }
      try{
        var headerLabels = CANON_FIELDS.map(function(f){ return FIELD_LABELS[f]; });
        var sheetRows = rows.map(function(r){
          var obj = {};
          CANON_FIELDS.forEach(function(f){ obj[FIELD_LABELS[f]] = r[f] || ''; });
          return obj;
        });
        var ws = XLSX.utils.json_to_sheet(sheetRows, { header: headerLabels });
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Contactos');
        var arrayBuffer = XLSX.write(wb, { bookType:'xlsx', type:'array' });
        var filename = 'contactos-' + slugify(ev ? ev.name : 'feria') + '.xlsx';
        var blob = new Blob([arrayBuffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        downloadBlob(blob, filename);
        toast('Archivo descargado.');
      }catch(err){
        toast('No se pudo exportar: ' + (err && err.message ? err.message : 'error desconocido'));
      }
    },

    copyReportEmail: function(eventId){
      var parts = buildReportEmailParts(eventId);
      if(!parts) return;
      var html = buildReportEmailHtml(parts);
      var plain = 'Para: '+parts.to+'\nAsunto: '+parts.subject+'\n\n'+parts.body;
      copyHtmlToClipboard(html, plain).then(function(){
        toast('Reporte copiado con formato. Pégalo (Ctrl/Cmd+V) en un correo nuevo para '+parts.to+'.');
        markReportSentIfComplete(eventId, parts.to);
      }).catch(function(){
        toast('No se pudo copiar automáticamente. Selecciona y copia el texto manualmente.');
      });
    },
    downloadReportEmail: function(eventId){
      var parts = buildReportEmailParts(eventId);
      if(!parts) return;
      try{
        var html = wrapStandaloneHtml(buildReportEmailHtml(parts), parts.subject);
        var filename = 'reporte-' + slugify(parts.eventName) + '.html';
        var blob = new Blob([html], { type:'text/html' });
        downloadBlob(blob, filename);
        toast('Archivo descargado.');
        markReportSentIfComplete(eventId, parts.to);
      }catch(err){
        toast('No se pudo descargar: ' + (err && err.message ? err.message : 'error desconocido'));
      }
    },

    showContactsFor: function(field, encodedValue){
      var value = decodeURIComponent(encodedValue);
      var eventId = state.currentEventId;
      var contacts = state.contactsByEvent[eventId] || [];
      var matches = contacts.filter(function(c){
        if(field==='normas'){
          var raw = (c.normas||'').trim();
          if(!raw) return value==='Sin especificar';
          return raw.split(/[,;\/]+/).map(function(s){ return s.trim(); }).indexOf(value) >= 0;
        }
        var raw2 = (c[field]||'').trim();
        if(!raw2) return value==='Sin especificar';
        return raw2 === value;
      });
      var fieldLabels = { ejecutivo:'Ejecutivo', servicio:'Servicio', ubicacion:'Ubicación', contactoVia:'Contacto vía', normas:'Norma' };
      var rows = matches.map(function(c){
        return '<tr>' +
          '<td>'+escapeHtml(c.nombre||'—')+'</td>' +
          '<td>'+escapeHtml(c.empresa||'—')+'</td>' +
          '<td>'+escapeHtml(c.telefono||'—')+'</td>' +
          '<td>'+escapeHtml(c.correo||'—')+'</td>' +
          '<td>'+escapeHtml(c.ejecutivo||'—')+'</td>' +
          '<td>'+escapeHtml(c.servicio||'—')+'</td>' +
        '</tr>';
      }).join('');
      document.getElementById('modalRoot').innerHTML =
        '<div class="modal-backdrop" onclick="if(event.target===this) App.closeModal()">' +
          '<div class="modal" style="max-width:880px;">' +
            '<h3>'+matches.length+' contacto(s) · '+escapeHtml(fieldLabels[field]||field)+': '+escapeHtml(value)+'</h3>' +
            '<div class="table-wrap" style="max-height:60vh;overflow:auto;">' +
              '<table><thead><tr><th>Nombre</th><th>Empresa</th><th>Teléfono</th><th>Correo</th><th>Ejecutivo</th><th>Servicio</th></tr></thead><tbody>' +
                (rows || '<tr><td colspan="6" style="color:var(--ink-muted);">Sin contactos para este valor.</td></tr>') +
              '</tbody></table>' +
            '</div>' +
            '<div class="actions"><button type="button" class="btn btn-ghost" onclick="App.closeModal()">Cerrar</button></div>' +
          '</div>' +
        '</div>';
    }
  };

  /* ---------------------------------------------------------------- */
  /* init                                                                */
  /* ---------------------------------------------------------------- */
  function bindStaticEvents(){
    document.getElementById('btnNewEvent').addEventListener('click', function(){ App.openEventModal(false); });
    document.getElementById('eventSelect').addEventListener('change', function(e){
      state.currentEventId = e.target.value || null;
      state.parsedUpload = null;
      state.openExecSlug = null;
      state.surveyDraft = {};
      state.showAddRoster = false;
      subscribeEventChildren();
      renderAll();
    });
    document.querySelectorAll('.tab-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ setActiveTab(btn.dataset.tab); });
    });
  }

  function init(){
    bindStaticEvents();
    setActiveTab('resumen');
    initDb();
  }

  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', init); } else { init(); }
})();
</script>

</body></html>
